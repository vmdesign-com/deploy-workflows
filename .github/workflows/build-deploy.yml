# Zentraler Build- & Deploy-Workflow für alle vmDesign-Websites.
#
# Wird von jedem Website-Repo über `uses:` aufgerufen (siehe website-vorlage/deploy.yml).
# Ablauf: (nur nachts) prüfen, ob sich Inhalte oder Code geändert haben
#         → Code holen → Abhängigkeiten installieren → bauen → Ergebnis prüfen
#         → per SFTP/FTPS hochladen (erst Assets, dann HTML, dann Altlasten löschen)
#         → Live-Check der Website.
# Jeder Deploy legt /deploy-info.json mit Sanity-Fingerabdruck und Commit auf den Server.
# Der nächtliche Lauf vergleicht damit und baut nur, wenn sich etwas geändert hat.
# Schlägt ein Schritt fehl, wird nichts (weiter) hochgeladen und GitHub schickt eine E-Mail.

name: Build & Deploy

on:
  workflow_call:
    inputs:
      remote-path:
        description: "Zielordner am Server, relativ zum Login-Ordner (z. B. public_html oder kunde-a.at) oder absolut"
        type: string
        required: true
      protocol:
        description: "Übertragungsart: sftp (Standard), ftps (FTP mit TLS, Port 21), ftps-implicit (Port 990) oder ftp (unverschlüsselt)"
        type: string
        default: "sftp"
      verify-certificate:
        description: "Nur FTPS: TLS-Zertifikat des Servers prüfen. Auf false setzen, wenn der Hoster ein Zertifikat für einen anderen Namen verwendet."
        type: boolean
        default: true
      allow-root:
        description: "Erlaubt '/' oder '.' als Zielordner, wenn der FTP-Zugang direkt im Web-Ordner der Website landet"
        type: boolean
        default: false
      site-url:
        description: "Optional: URL der Live-Seite für den Check nach dem Upload"
        type: string
        default: ""
      node-version:
        description: "Node-Version für den Build"
        type: string
        default: "22"
      build-command:
        description: "Optional: eigener Build-Befehl (Standard: <paketmanager> run build)"
        type: string
        default: ""
      output-dir:
        description: "Ordner mit der fertigen Seite"
        type: string
        default: "dist"
      working-directory:
        description: "Ordner mit der package.json (für Monorepos)"
        type: string
        default: "."
      keep-remote:
        description: "Pfade am Server (Leerzeichen-getrennt, relativ zum Zielordner), die nie gelöscht oder überschrieben werden"
        type: string
        default: ".well-known cgi-bin .ftpquota"
      max-delete:
        description: "Abbruch, wenn mehr als so viele Dateien/Ordner am Server gelöscht würden (0 = keine Grenze)"
        type: number
        default: 200
      sanity-project-id:
        description: "Sanity-Projekt-ID. Nötig, damit der nächtliche Lauf Inhaltsänderungen erkennt."
        type: string
        default: ""
      sanity-dataset:
        description: "Sanity-Dataset"
        type: string
        default: "production"
      only-if-content-changed:
        description: "Nur bauen, wenn sich Sanity-Inhalte oder Code seit dem letzten Deploy geändert haben (für den nächtlichen Lauf)"
        type: boolean
        default: false
    secrets:
      SFTP_HOST:
        required: true
      SFTP_USER:
        required: true
      SFTP_PORT:
        required: false
      SFTP_PASSWORD:
        required: false
      SSH_PRIVATE_KEY:
        required: false
      SFTP_KNOWN_HOSTS:
        required: false
      BUILD_ENV:
        required: false
      SANITY_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  check:
    name: Änderungen prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sanity-hash: ${{ steps.sanity.outputs.hash }}
    steps:
      - name: Sanity-Stand ermitteln
        id: sanity
        if: ${{ inputs.sanity-project-id != '' }}
        env:
          PROJECT_ID: ${{ inputs.sanity-project-id }}
          DATASET: ${{ inputs.sanity-dataset }}
          TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: |
          # Fingerabdruck aller veröffentlichten Dokumente (ID + Revision).
          # Erkennt neue, geänderte und gelöschte Inhalte.
          query='*[] | order(_id asc) {_id, _rev}'
          url="https://${PROJECT_ID}.api.sanity.io/v2025-02-19/data/query/${DATASET}"
          auth=()
          if [ -n "$TOKEN" ]; then auth=(-H "Authorization: Bearer $TOKEN"); fi
          if ! body=$(curl -sS --fail --max-time 60 --retry 3 --retry-delay 5 -G "$url" \
                --data-urlencode "query=$query" --data-urlencode "perspective=published" "${auth[@]}"); then
            echo "::warning::Sanity-Abfrage fehlgeschlagen – Inhaltsstand unbekannt."
            exit 0
          fi
          count=$(jq '.result | length' <<< "$body")
          if [ "$count" -eq 0 ]; then
            echo "::warning::Sanity liefert 0 Dokumente. Ist das Dataset privat? Dann ein Lesetoken als Secret SANITY_READ_TOKEN hinterlegen."
            exit 0
          fi
          hash=$(jq -c '.result' <<< "$body" | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Sanity: $count Dokumente, Fingerabdruck $hash"

      - name: Entscheiden
        id: decide
        env:
          ONLY_IF_CHANGED: ${{ inputs.only-if-content-changed }}
          SITE_URL: ${{ inputs.site-url }}
          HASH: ${{ steps.sanity.outputs.hash }}
          PROJECT_ID: ${{ inputs.sanity-project-id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          go() {
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "→ Deploy: $1"
            exit 0
          }
          [ "$ONLY_IF_CHANGED" = "true" ] || go "direkt ausgelöst ($EVENT)"
          [ -n "$SITE_URL" ] || go "keine site-url zum Vergleichen hinterlegt"
          if [ -z "$PROJECT_ID" ]; then
            echo "::warning::Keine sanity-project-id gesetzt – nachts werden nur Code-Änderungen erkannt."
          elif [ -z "$HASH" ]; then
            go "Sanity-Stand unbekannt, sicherheitshalber neu bauen"
          fi
          info=$(curl -sSL --fail --max-time 30 --retry 2 "${SITE_URL%/}/deploy-info.json?t=$(date +%s)" 2>/dev/null) \
            || go "deploy-info.json auf der Website nicht gefunden (erster Lauf?)"
          live_hash=$(jq -r '.sanity // ""' <<< "$info" 2>/dev/null) || go "deploy-info.json nicht lesbar"
          live_commit=$(jq -r '.commit // ""' <<< "$info")
          echo "Online:  Sanity ${live_hash:-–}, Commit ${live_commit:0:7}"
          echo "Aktuell: Sanity ${HASH:-–}, Commit ${SHA:0:7}"
          if [ -n "$HASH" ] && [ "$HASH" != "$live_hash" ]; then go "Sanity-Inhalte haben sich geändert"; fi
          if [ "$SHA" != "$live_commit" ]; then go "Code-Stand online weicht ab"; fi
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          echo "Keine Änderungen seit dem letzten Deploy – nichts zu tun."
          echo "### 💤 Keine Änderungen – Deploy übersprungen" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build & Deploy
    needs: check
    if: ${{ needs.check.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pro Website läuft immer nur ein Deploy. Kommen währenddessen weitere Auslöser,
    # wartet genau einer (der neueste) und startet danach. Ein laufender Upload wird
    # nie abgebrochen, damit die Seite nie halb hochgeladen bleibt.
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      OUTPUT_DIR: ${{ inputs.output-dir }}
      REMOTE_PATH: ${{ inputs.remote-path }}
      PROTOCOL: ${{ inputs.protocol }}

    steps:
      - name: Auslöser protokollieren
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Ausgelöst durch: $EVENT ${ACTION:+($ACTION)} von $ACTOR"

      - name: Code holen
        uses: actions/checkout@v6

      - name: Paketmanager erkennen
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then pm=pnpm; cache=""
          elif [ -f yarn.lock ]; then pm=yarn; cache=""
          elif [ -f package-lock.json ]; then pm=npm; cache=npm
          else pm=npm; cache=""
          fi
          echo "name=$pm" >> "$GITHUB_OUTPUT"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"
          echo "Paketmanager: $pm"

      - name: Node einrichten
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Abhängigkeiten installieren
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: |
          case "$PM" in
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --frozen-lockfile ;;
            npm)
              if [ -f package-lock.json ]; then npm ci
              else
                echo "::warning::Keine package-lock.json gefunden – verwende 'npm install'. Lockfile committen für reproduzierbare Builds."
                npm install
              fi ;;
          esac

      - name: Build-Umgebungsvariablen setzen
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          if [ -z "$BUILD_ENV" ]; then
            echo "Keine BUILD_ENV hinterlegt – überspringe."
            exit 0
          fi
          # Als .env-Datei für Astro/Vite …
          printf '%s\n' "$BUILD_ENV" > .env
          # … und als Prozess-Umgebung für astro.config & Co.
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; *=*) ;; *) echo "::warning::Zeile in BUILD_ENV übersprungen (kein KEY=VALUE)"; continue ;; esac
            key="${line%%=*}"; val="${line#*=}"
            key="$(echo "$key" | sed -E 's/^[[:space:]]*(export[[:space:]]+)?//; s/[[:space:]]+$//')"
            [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::warning::Zeile in BUILD_ENV übersprungen (kein KEY=VALUE)"; continue; }
            # umschließende Anführungszeichen entfernen
            if [[ "$val" =~ ^\"(.*)\"$ ]] || [[ "$val" =~ ^\'(.*)\'$ ]]; then val="${BASH_REMATCH[1]}"; fi
            if [ "${#val}" -ge 8 ]; then echo "::add-mask::$val"; fi
            echo "$key=$val" >> "$GITHUB_ENV"
          done <<< "$BUILD_ENV"
          echo "BUILD_ENV gesetzt."

      - name: Bauen
        env:
          PM: ${{ steps.pm.outputs.name }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          if [ -n "$BUILD_COMMAND" ]; then
            eval "$BUILD_COMMAND"
          else
            "$PM" run build
          fi

      - name: Build-Ergebnis prüfen
        run: |
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::error::Ordner '$OUTPUT_DIR' existiert nach dem Build nicht. Stimmt 'output-dir'?"
            exit 1
          fi
          if [ ! -f "$OUTPUT_DIR/index.html" ]; then
            echo "::error::'$OUTPUT_DIR/index.html' fehlt – Upload abgebrochen, damit die Live-Seite nicht überschrieben wird."
            exit 1
          fi
          files=$(find "$OUTPUT_DIR" -type f | wc -l)
          size=$(du -sh "$OUTPUT_DIR" | cut -f1)
          echo "Build ok: $files Dateien, $size"
          echo "BUILD_FILES=$files" >> "$GITHUB_ENV"

      - name: Deploy-Info schreiben
        env:
          HASH: ${{ needs.check.outputs.sanity-hash }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -n --arg sanity "$HASH" --arg commit "$SHA" --arg event "$EVENT" \
                --arg zeit "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{sanity: $sanity, commit: $commit, ausloeser: $event, zeit: $zeit}' > "$OUTPUT_DIR/deploy-info.json"
          cat "$OUTPUT_DIR/deploy-info.json"

      - name: Zielordner und Protokoll prüfen
        env:
          ALLOW_ROOT: ${{ inputs.allow-root }}
        run: |
          case "$PROTOCOL" in
            sftp|ftps|ftps-implicit) ;;
            ftp) echo "::warning::Unverschlüsseltes FTP: Passwort und Dateien gehen im Klartext übers Netz. Wenn der Hoster es anbietet, 'ftps' oder 'sftp' verwenden." ;;
            *) echo "::error::Unbekanntes Protokoll '$PROTOCOL'. Erlaubt: sftp, ftps, ftps-implicit, ftp."; exit 1 ;;
          esac
          p="$REMOTE_PATH"
          while [ "${#p}" -gt 1 ] && [ "${p%/}" != "$p" ]; do p="${p%/}"; done
          if [ -z "$p" ] || [ "$p" = "~" ] || [[ "$p" == *..* ]]; then
            echo "::error::Unsicherer Zielordner '$REMOTE_PATH'."
            exit 1
          fi
          if [ "$p" = "/" ] || [ "$p" = "." ]; then
            if [ "$ALLOW_ROOT" != "true" ]; then
              echo "::error::Zielordner '$p' ist der oberste Ordner des Zugangs. Nur verwenden, wenn der Zugang direkt im Web-Ordner der Website landet – dann 'allow-root: true' setzen."
              exit 1
            fi
            echo "::notice::Zielordner ist der oberste Ordner des Zugangs (allow-root)."
          elif [[ "$p" =~ ^/(home|root|var|etc|usr|srv|opt|tmp)(/[^/]+)?$ ]]; then
            echo "::error::Unsicherer Zielordner '$REMOTE_PATH'. Bitte den Web-Ordner der Website angeben, z. B. public_html oder kunde-a.at."
            exit 1
          fi
          echo "Protokoll: $PROTOCOL, Zielordner: $p"

      - name: lftp installieren
        run: |
          if ! command -v lftp >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lftp >/dev/null
          fi
          lftp --version | head -1

      - name: SSH vorbereiten
        if: ${{ inputs.protocol == 'sftp' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          port="${SFTP_PORT:-22}"
          if [ -n "$SFTP_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "Server-Schlüssel aus SFTP_KNOWN_HOSTS übernommen."
          else
            ssh-keyscan -p "$port" -T 15 "$SFTP_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error::Server $SFTP_HOST:$port nicht erreichbar (ssh-keyscan ohne Antwort). Host/Port prüfen."
              exit 1
            fi
            echo "::notice::Kein SFTP_KNOWN_HOSTS hinterlegt – Server-Schlüssel wurde live abgefragt. Für mehr Sicherheit den Inhalt unten als Secret SFTP_KNOWN_HOSTS speichern."
            cat ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "Anmeldung per SSH-Schlüssel."
          elif [ -n "$SFTP_PASSWORD" ]; then
            echo "Anmeldung per Passwort."
          else
            echo "::error::Weder SSH_PRIVATE_KEY noch SFTP_PASSWORD hinterlegt."
            exit 1
          fi

      - name: Hochladen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          KEEP_REMOTE: ${{ inputs.keep-remote }}
          MAX_DELETE: ${{ inputs.max-delete }}
          VERIFY_CERT: ${{ inputs.verify-certificate }}
        run: |
          set -euo pipefail
          remote="$REMOTE_PATH"
          while [ "${#remote}" -gt 1 ] && [ "${remote%/}" != "$remote" ]; do remote="${remote%/}"; done
          local_dir="$(cd "$OUTPUT_DIR" && pwd)"
          work="$(mktemp -d)"
          verify=no; [ "$VERIFY_CERT" = "true" ] && verify=yes

          proto_settings=""
          case "$PROTOCOL" in
            sftp)
              port="${SFTP_PORT:-22}"; parallel=4
              ssh_cmd="ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ServerAliveInterval=15 -o ConnectTimeout=20"
              if [ -f "$HOME/.ssh/deploy_key" ]; then
                ssh_cmd="$ssh_cmd -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -i $HOME/.ssh/deploy_key"
                open_cmd="open -u \"$SFTP_USER\", -p $port sftp://$SFTP_HOST"
              else
                ssh_cmd="$ssh_cmd -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
                open_cmd="open --env-password -u \"$SFTP_USER\" -p $port sftp://$SFTP_HOST"
              fi
              proto_settings="set sftp:auto-confirm no
          set sftp:connect-program \"$ssh_cmd\""
              ;;
            ftps|ftps-implicit|ftp)
              if [ -z "${LFTP_PASSWORD:-}" ]; then
                echo "::error::Für FTP/FTPS wird das Secret SFTP_PASSWORD benötigt."
                exit 1
              fi
              parallel=3
              proto_settings="set ftp:passive-mode true
          set ftp:prefer-epsv false
          set ssl:verify-certificate $verify"
              if [ "$PROTOCOL" = "ftps" ]; then
                port="${SFTP_PORT:-21}"; scheme=ftp
                proto_settings="$proto_settings
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true"
              elif [ "$PROTOCOL" = "ftps-implicit" ]; then
                port="${SFTP_PORT:-990}"; scheme=ftps
                proto_settings="$proto_settings
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true"
              else
                port="${SFTP_PORT:-21}"; scheme=ftp
                proto_settings="$proto_settings
          set ftp:ssl-allow false"
              fi
              open_cmd="open --env-password -u \"$SFTP_USER\" -p $port $scheme://$SFTP_HOST"
              ;;
          esac

          # Geschützte Pfade am Server: werden weder gelöscht noch überschrieben
          excludes=""
          for p in $KEEP_REMOTE; do
            p="${p#/}"; p="${p%/}"
            [ -n "$p" ] || continue
            # shellcheck disable=SC2016
            esc="$(printf '%s' "$p" | sed 's/[][\.*^$()+?{}|]/\\&/g')"
            excludes="$excludes --exclude '^${esc}(/|\$)'"
          done
          mirror_opts="--reverse --verbose=1 --parallel=$parallel --no-perms --overwrite"

          preamble() {
            cat <<EOF
          set cmd:fail-exit yes
          set net:max-retries 4
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set net:timeout 30
          $proto_settings
          $open_cmd
          mkdir -p -f "$remote"
          cd "$remote"
          EOF
          }

          # --- Probelauf: Was würde gelöscht? -------------------------------
          { preamble
            echo "echo __BASE__"
            echo "pwd"
            echo "mirror $mirror_opts --dry-run --delete $excludes \"$local_dir\" ."
            echo "bye"; } > "$work/plan.lftp"
          lftp -f "$work/plan.lftp" > "$work/plan.txt"
          grep -E '^rm ' "$work/plan.txt" > "$work/deletes.txt" || true
          n_del=$(wc -l < "$work/deletes.txt" | tr -d ' ')
          n_up=$(grep -cE '^(put|get) ' "$work/plan.txt" || true)
          echo "Plan: $n_up Dateien hochladen, $n_del Einträge am Server löschen."
          if [ "$n_del" -gt 0 ]; then
            echo "Zu löschen:"; sed 's/^/  /' "$work/deletes.txt" | head -50
          fi

          # Schutz 1: Ordner mit Domain-Namen (z. B. Addon-Domains in public_html) nie löschen
          urlpath() { printf '%s' "$1" | sed -E 's#^[a-z]+://[^/]*##; s#/+$##'; }
          base="$(urlpath "$(sed -n '/^__BASE__$/{n;p;q;}' "$work/plan.txt")")"
          blocked=""
          while IFS= read -r line; do
            case "$line" in "rm -r "*) ;; *) continue ;; esac
            path="$(urlpath "${line#rm -r }")"
            rel="${path#"$base"/}"
            if [[ "$rel" != */* && "$rel" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
              blocked="$blocked $rel"
            fi
          done < "$work/deletes.txt"
          if [ -n "$blocked" ]; then
            echo "::error::Abbruch: Der Deploy würde die Ordner${blocked} am Server löschen. Das sieht nach anderen Websites aus. Ordner in 'keep-remote' eintragen oder einen eigenen Zielordner verwenden."
            exit 1
          fi

          # Schutz 2: ungewöhnlich viele Löschungen
          if [ "${MAX_DELETE:-0}" -gt 0 ] && [ "$n_del" -gt "$MAX_DELETE" ]; then
            echo "::error::Abbruch: $n_del Löschungen geplant (Grenze: $MAX_DELETE). Liste oben prüfen und bei Bedarf 'max-delete' einmalig erhöhen."
            exit 1
          fi

          # --- Echter Upload ----------------------------------------------
          { preamble
            echo "# 1. Alle Nicht-HTML-Dateien (CSS, JS, Bilder …) – bestehende Seiten funktionieren weiter"
            echo "mirror $mirror_opts --exclude '\\.html\$' $excludes \"$local_dir\" ."
            echo "# 2. HTML-Seiten hochladen und veraltete Dateien entfernen"
            echo "mirror $mirror_opts --delete $excludes \"$local_dir\" ."
            echo "bye"; } > "$work/deploy.lftp"

          echo "Lade per $PROTOCOL nach $SFTP_HOST:$remote hoch …"
          lftp -f "$work/deploy.lftp"
          echo "Upload abgeschlossen."

      - name: Live-Check
        if: ${{ inputs.site-url != '' }}
        env:
          SITE_URL: ${{ inputs.site-url }}
        run: |
          sep='?'; case "$SITE_URL" in *'?'*) sep='&' ;; esac
          url="${SITE_URL}${sep}deploy=${GITHUB_RUN_ID}"
          code=$(curl -sSL -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 "$url" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::Live-Check fehlgeschlagen: $SITE_URL antwortet mit HTTP $code"
            exit 1
          fi
          echo "Live-Check ok: $SITE_URL (HTTP 200)"
          # Kontrolle, ob der Upload im richtigen Web-Ordner gelandet ist
          live_commit=$(curl -sSL --max-time 30 "${SITE_URL%/}/deploy-info.json?t=$(date +%s)" | jq -r '.commit // ""' 2>/dev/null || true)
          if [ "$live_commit" = "$GITHUB_SHA" ]; then
            echo "deploy-info.json ist online – Zielordner stimmt."
          else
            echo "::warning::$SITE_URL/deploy-info.json zeigt nicht den neuen Stand. Zeigt 'remote-path' auf den Web-Ordner dieser Domain, oder liefert ein Cache noch die alte Datei? Sonst baut der nächtliche Lauf jede Nacht neu."
          fi

      - name: Zusammenfassung
        if: ${{ always() }}
        env:
          STATUS: ${{ job.status }}
          SITE_URL: ${{ inputs.site-url }}
          PROTOCOL: ${{ inputs.protocol }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: |
          {
            if [ "$STATUS" = "success" ]; then echo "### ✅ Deploy erfolgreich"; else echo "### ❌ Deploy fehlgeschlagen ($STATUS)"; fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Auslöser | $EVENT ${ACTION:+($ACTION)} |"
            echo "| Ziel | $PROTOCOL · \`$REMOTE_PATH\` |"
            echo "| Dateien | ${BUILD_FILES:-–} |"
            if [ -n "$SITE_URL" ]; then echo "| Website | $SITE_URL |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
